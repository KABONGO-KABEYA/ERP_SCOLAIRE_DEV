# ERP SCOLAIRE — API Cloud (Docker Compose)
#
# Usage :
#   1. Copier .env.example → .env et renseigner les secrets
#   2. docker compose up -d --build
#   3. Tester : http://localhost:1804/api/v1/health
#
# Le service `sql` est optionnel (profil "full").
# En production, pointez SQL_CONNECTION_STRING vers votre SQL distant (ex. 161.97.105.22).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: erp-scolaire-api-cloud:latest
    container_name: erp-api-cloud
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-1804}:1804"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:1804
      Deployment__Role: Cloud
      Deployment__ReadOnly: "true"
      FILE_STORAGE_ROOT: /app/data/files
      SERVER_IDENTITY_DIR: /app/data/files/server-identity
      SQL_CONNECTION_STRING: ${SQL_CONNECTION_STRING}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-SchoolManagementRDC}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolManagementClients}
      ERP_CONFIG_ENCRYPTION_KEY: ${ERP_CONFIG_ENCRYPTION_KEY:-}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-*}
    volumes:
      - erp_api_files:/app/data/files
      - erp_api_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1804/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  # Profil optionnel : SQL dans Compose (dev / bootstrap).
  # Démarrer avec : docker compose --profile full up -d --build
  sql:
    profiles: ["full"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erp-sql-cloud
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${SQL_HOST_PORT:-1433}:1433"
    volumes:
      - erp_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  erp_api_files:
  erp_api_logs:
  erp_sql_data:
