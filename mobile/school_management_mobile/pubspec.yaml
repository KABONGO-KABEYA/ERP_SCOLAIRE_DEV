name: school_management_mobile
description: Application mobile ERP Administration Scolaire RDC (Parents, Enseignants, Direction, Promoteur, Secrétariat).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: ^0.69.2
  intl: any
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3

# Évite objective_c (native assets) qui casse le build Android sur Windows.
dependency_overrides:
  path_provider_foundation: 2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#1E5EFF"
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/images/payments/
